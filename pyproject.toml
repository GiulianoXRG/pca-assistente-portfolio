[project]
name = "pca-assistente"
version = "0.1.0"
description = "Monta as planilhas do PCA (DPGC/UFRN) a partir das requisições do SIPAC e grava no Google Sheets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "playwright>=1.45",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[project.scripts]
pca = "pca_assistente.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pca_assistente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
